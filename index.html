<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turpialy - ¡Misión Cumplida!</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #800020;
            --secondary: #4b0082;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --success: #00d68f;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
            overflow: hidden;
        }
        .celebration-card {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(128, 0, 32, 0.4);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .icon-box {
            font-size: 4rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }
        h1 { font-size: 2.2rem; color: #fff; margin-bottom: 10px; }
        h2 { font-size: 1.4rem; color: var(--success); margin-bottom: 20px; font-weight: 600; }
        p { color: #aaa; font-size: 1rem; line-height: 1.6; margin-bottom: 25px; }
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="celebration-card">
    <div class="icon-box">
        <i class="fas fa-graduation-cap"></i>
    </div>
    <span class="badge">Etapa Concluida</span>
    <h1 style="margin-top: 15px;">Turpialy</h1>
    <h2>¡No hay más tareas, felicidades! 🎉</h2>
    <p>
        El bachillerato oficialmente quedó atrás. Esta plataforma cumplió su propósito y queda retirada. 
        ¡Éxitos en todo lo que se viene para el futuro!
    </p>
</div>

<script>
    // Lanzar confeti continuo en bucle
    const duration = 15 * 1000;
    const animationEnd = Date.now() + duration;
    const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

    function randomInRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    // Ráfaga inicial al cargar
    confetti({ ...defaults, particleCount: 100, origin: { y: 0.6 } });

    // Lluvia constante durante unos segundos
    const interval = setInterval(function() {
      const timeLeft = animationEnd - Date.now();

      if (timeLeft <= 0) {
        return clearInterval(interval);
      }

      const particleCount = 50 * (timeLeft / duration);
      confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } });
      confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } });
    }, 250);
</script>

</body>
</html>
